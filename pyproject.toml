[project]
name = "freeroute"
version = "0.1.0"
description = "One local router for many free LLM APIs, with a live dashboard"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6",
    "python-dotenv>=1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
fr = "freeroute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
