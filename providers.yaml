# Generated from FreeLLMAPI's public free-model catalog (2026-10-08) plus live provider lists.
# Edit freely. Providers without a key in .env are skipped automatically.
#
# routing: rank   -> try the smartest available model first, across every provider
#          order  -> try providers top to bottom, models top to bottom
# rank:           intelligence rank from the catalog (lower = smarter)
# tools:          false = the model cannot call tools, so the coding agent skips it
# shared_limits:  one limit covers every model of the provider
# keyless:        no key needed; set the key_env variable to 1 in .env to opt in
# discover:       model list is fetched by `fr sync` instead of listed here
# context:        rough input budget in tokens for the coding agent (default 32000; per model too).
#                 Groq's is its per-minute token limit. Lower it if a provider rejects long requests.
# hedge_after:    seconds to wait for an answer before also trying the next provider (up to 3 at once);
#                 the first answer wins. 0 = try one model at a time.

routing: rank
hedge_after: 20

